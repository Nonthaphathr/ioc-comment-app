<style>
/* Layout idea: one-column mobile-first stack; home = 5 expert cards, expert = rows of 5 number chips per dimension, item = question card + comment box + sticky prev/next bar */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --ink:#16212b; --muted:#566574; --line:#d6dee5;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d5eeea; --bad:#b42318; --ok:#157f3b; --warn:#a15c07;
  --font-body:"Sarabun","Noto Sans Thai",system-ui,sans-serif; --font-display:"Prompt","Sarabun",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#18222b; --ink:#e7edf2; --muted:#9aabb9; --line:#2b3a47;
  --accent:#3fb8aa; --accent-ink:#06201d; --accent-soft:#16363a; --bad:#ff8a7e; --ok:#5fd18a; --warn:#f2b45a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#18222b; --ink:#e7edf2; --muted:#9aabb9; --line:#2b3a47;
  --accent:#3fb8aa; --accent-ink:#06201d; --accent-soft:#16363a; --bad:#ff8a7e; --ok:#5fd18a; --warn:#f2b45a; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 0 10px}
.top .row{display:flex;align-items:center;gap:10px;max-width:680px;margin:0 auto;padding:0 16px}
.top .logo{width:40px;height:40px;flex:none;border-radius:50%}
.top h1{font:600 1.05rem/1.25 var(--font-display);margin:0;flex:1;min-width:0;text-wrap:balance}
.top h1 small{display:block;font:400 .8rem var(--font-body);color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-weight:600}
.iconbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--warn);display:inline-block}
.live.on i{background:var(--ok)} .live.off i{background:var(--bad)}
.intro{margin:18px 0 14px;color:var(--muted);font-size:.95rem}
.cards{display:grid;gap:12px}
.card{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-height:72px}
.card:active{background:var(--accent-soft)}
.num{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 1.15rem var(--font-display)}
.card .who{flex:1;min-width:0}
.card b{display:block;font-weight:600;line-height:1.3}
.card span.pos{display:block;color:var(--muted);font-size:.85rem;line-height:1.35}
.badge{flex:none;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent);line-height:1.1}
.badge small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;margin:16px 0}
.tabs button{border:0;background:transparent;border-radius:10px;min-height:44px;font-weight:600;color:var(--muted);line-height:1.2}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button small{display:block;font-weight:400;font-size:.72rem;opacity:.9}
.ptitle{font:600 .95rem var(--font-display);margin:4px 0 12px}
.group{margin:0 0 18px}
.group h3{margin:0 0 8px;font-size:.92rem;font-weight:600;color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chip{position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-height:54px;font:600 1.1rem var(--font-display);font-variant-numeric:tabular-nums}
.chip small{display:block;font:400 .68rem var(--font-body);color:var(--muted);line-height:1}
.chip.has{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.has small{color:var(--accent-ink);opacity:.85}
.legend{display:flex;gap:16px;font-size:.82rem;color:var(--muted);margin:0 0 14px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;border:1.5px solid var(--line);background:var(--surface)}
.legend i.has{background:var(--accent);border-color:var(--accent)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:16px 0 14px}
.q .meta{font-size:.82rem;color:var(--muted);margin-bottom:6px}
.q p{margin:0;font-size:1.05rem}
.q ul{margin:8px 0 0;padding-left:20px;color:var(--muted)}
label.lbl{display:block;font-weight:600;margin:0 0 6px}
textarea{width:100%;min-height:210px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:1.05rem;background:var(--surface);color:var(--ink);resize:vertical}
textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.tplbtn{display:inline-flex;align-items:center;gap:6px;margin:0 0 8px;min-height:44px;padding:8px 14px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.status{min-height:26px;margin:8px 2px 0;font-size:.85rem;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.status.ok{color:var(--ok)} .status.err{color:var(--bad)} .status button{border:1px solid currentColor;background:transparent;border-radius:8px;padding:2px 10px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.bar button{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.bar button.next{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bar button:disabled{opacity:.4}
.bar .pos{font-size:.8rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.pad-bar{height:96px}
dialog{border:0;padding:0;background:transparent;max-width:none;width:100%;margin:auto 0 0;color:var(--ink)}
dialog::backdrop{background:rgba(10,18,25,.55)}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto;max-height:88vh;overflow:auto}
.sheet h2{font:600 1.1rem var(--font-display);margin:0 0 4px}
.sheet .sub{color:var(--muted);font-size:.88rem;margin:0 0 14px}
.opts{display:grid;gap:8px;margin:0 0 14px}
.opt{display:flex;gap:12px;align-items:center;min-height:46px;border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--bg)}
.opt input{width:22px;height:22px;accent-color:var(--accent)}
.acts{display:grid;gap:10px}
.act{display:flex;gap:12px;align-items:center;text-align:left;min-height:56px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:8px 14px;font-weight:600}
.act small{display:block;font-weight:400;color:var(--muted)}
.act b{flex:none;width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 .8rem var(--font-display)}
.preview{width:100%;min-height:150px;margin-top:12px;font-size:.85rem;font-family:ui-monospace,monospace}
.close{margin-top:12px;width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;font-size:.92rem;max-width:90%}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
button.gen{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:56px;padding:12px 16px;border:1px dashed var(--accent);background:transparent;color:var(--accent);border-radius:14px;font:inherit;font-weight:600;text-align:left;cursor:pointer}
button.gen small{font-weight:400;color:var(--muted)} button.gen.has{background:var(--accent-soft);border-style:solid}
@media(max-width:420px){.itxt{display:none}.top .live span{display:none}.top .logo{width:34px;height:34px}}
</style>
</head>

const db = supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:5}}});
const cache = {};          // key -> {comment, updated_at}
const pending = {};        // key -> {timer, value}
let live = "wait";         // wait | on | off

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}

async function loadAll(){
  const {data,error}=await db.from("ioc_comments").select("expert_id,part,item_no,comment,updated_at");
  if(error) throw error;
  data.forEach(r=>{cache[keyOf(r.expert_id,r.part,r.item_no)]={comment:r.comment,updated_at:r.updated_at}});
}
function subscribe(){
  db.channel("ioc-live").on("postgres_changes",{event:"*",schema:"public",table:"ioc_comments"},payload=>{
    const r=payload.new; if(!r||!r.expert_id) return;
    const k=keyOf(r.expert_id,r.part,r.item_no);
    if(pending[k]) return; // กำลังพิมพ์อยู่ในเครื่องนี้
    cache[k]={comment:r.comment,updated_at:r.updated_at};
    const ta=$("#cm");
    if(ta && ta.dataset.key===k){ if(document.activeElement!==ta) ta.value=r.comment; }
    else if(!ta) softRender();
  }).subscribe(st=>{
    live = st==="SUBSCRIBED"?"on":(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED")?"off":"wait";
    paintLive();
  });
}
async function saveNow(k){
  const p=pending[k]; if(!p) return;
  clearTimeout(p.timer); const value=p.value; delete pending[k];
  const [e,pt,n]=k.split("-").map(Number);
  setStatus(k,"saving");
  const {error}=await db.from("ioc_comments").upsert({expert_id:e,part:pt,item_no:n,comment:value},{onConflict:"expert_id,part,item_no"});
  if(error){ pending[k]={timer:null,value}; setStatus(k,"err"); return; }
  cache[k]={comment:value,updated_at:new Date().toISOString()};
  setStatus(k,"ok");
}
function queueSave(k,value){
  if(pending[k]) clearTimeout(pending[k].timer);
  pending[k]={value,timer:setTimeout(()=>saveNow(k),700)};
  cache[k]={comment:value,updated_at:new Date().toISOString()};
  setStatus(k,"typing");
}
async function flushAll(){await Promise.all(Object.keys(pending).map(k=>saveNow(k)))}
function setStatus(k,st){
  const el=$("#st"); if(!el||el.dataset.key!==k) return;
  const m={typing:["","กำลังพิมพ์…"],saving:["","กำลังบันทึก…"],ok:["ok","✓ บันทึกแล้ว"],err:["err","บันทึกไม่สำเร็จ"]}[st];
  el.className="status "+m[0]; el.innerHTML=esc(m[1]);
  if(st==="err"){const b=document.createElement("button");b.textContent="ลองอีกครั้ง";b.onclick=()=>saveNow(k);el.appendChild(b)}
}

function route(){
  const h=decodeURIComponent(location.hash.replace(/^#/,""));
  const m=h.match(/^e([1-5])(?:\/([0-3])\/(\d+))?$/);
  if(!m) return {v:"home"};
  if(m[2]) return {v:"item",e:+m[1],p:+m[2],n:+m[3]};
  return {v:"expert",e:+m[1],p:+(sessionStorageGet("part"+m[1])||2)};
}
function sessionStorageGet(k){try{return sessionStorage.getItem(k)}catch(_){return null}}
function sessionStorageSet(k,v){try{sessionStorage.setItem(k,v)}catch(_){}}
function countFor(e,p){return SEQ.filter(s=>(!p||s.part===p)&&(cache[keyOf(e,s.part,s.no)]||{}).comment?.trim()).length}
function paintLive(){const el=$("#live"); if(!el) return; el.className="live "+live; el.lastChild.textContent=live==="on"?"เรียลไทม์":live==="off"?"ออฟไลน์":"กำลังเชื่อม…"}
function topRow(html){$("#topRow").innerHTML=html; paintLive()}
const liveHtml='<span class="live" id="live"><i></i><span>…</span></span>';
function exportBtn(e){return installBtn()+'<button class="iconbtn primary" data-export="'+(e||"")+'" aria-label="ส่งออกข้อมูล">ส่งออก</button>'}

function drawAppIcon(img,size,pad){const c=document.createElement("canvas");c.width=c.height=size;const x=c.getContext("2d");x.fillStyle="#ffffff";x.fillRect(0,0,size,size);const box=size*(1-2*pad),r=Math.min(box/img.width,box/img.height),w=img.width*r,h=img.height*r;x.drawImage(img,(size-w)/2,(size-h)/2,w,h);return c.toDataURL("image/png")}
function setHeadLink(rel,href,attrs){let l=document.querySelector('link[rel="'+rel+'"]');if(!l){l=document.createElement("link");l.rel=rel;document.head.appendChild(l)}l.href=href;Object.keys(attrs||{}).forEach(k=>l.setAttribute(k,attrs[k]));return l}

function collect(expertIds,withEmpty){
  const rows=[];
  expertIds.forEach(e=>{const x=EXPERTS[e-1];
    SEQ.forEach(s=>{const c=cache[keyOf(e,s.part,s.no)]; const t=(c&&c.comment||"").trim();
      if(!t&&!withEmpty) return;
      rows.push({e,expert:x.name,general:!!s.general,part:s.general?"ทั่วไป":s.part,partName:PART_SHORT[s.part],no:s.general?"-":s.no,sub:s.sub||"",group:s.part<=1?"":s.group,q:s.general?GEN_TEXT:fullText(s),comment:t,updated:c&&c.updated_at?new Date(c.updated_at).toLocaleString("th-TH"):""});
    })});
  return rows;
}
function buildText(rows,ids){
  let out="ข้อเสนอแนะของผู้เชี่ยวชาญ (IOC)\n\n";
  ids.forEach(e=>{const x=EXPERTS[e-1]; const rs=rows.filter(r=>r.e===e);
    out+="ผู้เชี่ยวชาญคนที่ "+x.id+": "+x.name+"\n"+"-".repeat(40)+"\n";
    if(!rs.length) out+="(ไม่มีข้อเสนอแนะ)\n";
    rs.forEach(r=>{out+=(r.general?GEN_TEXT+"\n"+(r.comment||"-")+"\n\n":"ตอนที่ "+r.part+" ข้อ "+r.no+(r.sub?" ("+r.sub+")":"")+"\nข้อคำถาม: "+r.q+"\nข้อเสนอแนะ: "+(r.comment||"-")+"\n\n")});
    out+="\n";});
  return out.trim()+"\n";
}

  try{await loadAll()}catch(err){
    console.error(err); live="off";
    $("#app").innerHTML='<div class="q"><p><b>เชื่อมต่อฐานข้อมูลไม่ได้</b></p><p>'+esc(err.message||err)+'</p><p>ตรวจสอบอินเทอร์เน็ต แล้วโหลดหน้านี้ใหม่</p></div>';
    topRow('<h1>ข้อเสนอแนะผู้เชี่ยวชาญ</h1>'+liveHtml); return;
  }
  subscribe(); render();
})();
</script>
</body>
</html>
